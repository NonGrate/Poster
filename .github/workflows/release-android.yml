# Android release to the Play internal track, on a version tag.
#
# Secrets (repository settings → Secrets → Actions):
#   POSTER_KEYSTORE_BASE64      the upload keystore, base64 (`base64 -i upload.jks`)
#   POSTER_KEYSTORE_PASSWORD    its password
#   POSTER_KEY_ALIAS            the key alias
#   POSTER_KEY_PASSWORD         the key password
#   PLAY_SERVICE_ACCOUNT_JSON   a Play Console service account JSON with "Release to
#                               testing tracks" on the app (skip the upload step without it)
#
# The Gradle build reads POSTER_KEYSTORE* from the environment first, so nothing
# else is needed — see docs/ReleaseSigning.md. versionCode comes from the commit
# count; fetch-depth 0 below is what makes that count right on a runner.
name: Release Android
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore from secret
        run: |
          echo "${{ secrets.POSTER_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "POSTER_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Version
        run: ./gradlew :composeApp:printVersion --no-daemon -q
      - name: Release bundle
        env:
          POSTER_KEYSTORE_PASSWORD: ${{ secrets.POSTER_KEYSTORE_PASSWORD }}
          POSTER_KEY_ALIAS: ${{ secrets.POSTER_KEY_ALIAS }}
          POSTER_KEY_PASSWORD: ${{ secrets.POSTER_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRemoteRelease --no-daemon
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: composeApp/build/outputs/bundle/remoteRelease/*.aab
      - name: Upload to the Play internal track
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.poster
          releaseFiles: composeApp/build/outputs/bundle/remoteRelease/*.aab
          track: internal
          status: completed
