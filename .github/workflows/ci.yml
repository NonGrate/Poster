# What runs on every push and pull request: the tests that need no device.
# The instrumented Android suite and the iOS UI suite need an emulator/simulator
# and a running server; run those locally (docs/Testing.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Architecture and string checks
        run: scripts/check-architecture.sh
      - name: Shared, server and app unit tests
        run: ./gradlew :shared:jvmTest :server:test :composeApp:testRemoteDebugUnitTest --no-daemon
      - name: Android debug APK (proves the app compiles with the current poster.properties)
        run: ./gradlew :composeApp:assembleE2eDebug --no-daemon
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
