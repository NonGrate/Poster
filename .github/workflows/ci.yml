# What runs on every push and pull request: the tests that need no device, in
# the shipped configuration and with every feature flag off. The desktop target
# compiles in its own job; the iOS shell builds on macOS for pushes to main and
# on demand (macOS minutes cost ten times Linux ones). The instrumented Android
# suite and the iOS UI suite need an emulator/simulator and a running server;
# run those locally (docs/Testing.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Architecture and string checks
        run: scripts/check-architecture.sh
      - name: Shared, server and app unit tests
        run: ./gradlew :shared:jvmTest :server:test :composeApp:testRemoteDebugUnitTest --no-daemon
      - name: Android debug APK and instrumented-test sources (proves the app compiles with the current poster.properties)
        run: ./gradlew :composeApp:assembleE2eDebug :composeApp:compileE2eDebugAndroidTestKotlinAndroid --no-daemon
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  # Every feature off. Flag-dependent tests skip themselves; a failure here is a
  # missing gate in the code, not a wrong test.
  flags-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Turn every feature off
        run: sed -i 's/^\(feature\.[A-Za-z]*\)=true/\1=false/' poster.properties && grep -c '=false' poster.properties
      - name: Tests and compile with flags off
        run: ./gradlew :shared:jvmTest :server:test :composeApp:testRemoteDebugUnitTest :composeApp:compileE2eDebugKotlinAndroid --no-daemon

  # A mixed configuration, the kind a fork ends up with: a couple of features off,
  # an opt-in one on. Catches tests that guard one flag but lean on another.
  mixed-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Comments and images off, liquid look on
        run: sed -i -e 's/^feature.comments=true/feature.comments=false/' -e 's/^feature.images=true/feature.images=false/' -e 's/^feature.liquidDesign=false/feature.liquidDesign=true/' poster.properties
      - name: Tests and compile
        run: ./gradlew :shared:jvmTest :server:test :composeApp:testRemoteDebugUnitTest :composeApp:compileE2eDebugKotlinAndroid --no-daemon

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Desktop target on, billing off (docs/Desktop.md)
        run: sed -i -e 's/^feature.desktop=false/feature.desktop=true/' -e 's/^feature.support=true/feature.support=false/' poster.properties
      - name: Compile the desktop app
        run: ./gradlew :composeApp:compileKotlinDesktop --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Web target on, billing off (docs/Web.md)
        run: sed -i -e 's/^feature.web=false/feature.web=true/' -e 's/^feature.support=true/feature.support=false/' poster.properties
      - name: Compile both browser targets and build the bundle
        run: ./gradlew :shared:compileKotlinWasmJs :composeApp:wasmJsBrowserDistribution --no-daemon

  ios:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Kotlin framework for the simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Xcode build (no signing)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
