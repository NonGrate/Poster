<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Flat, not a gradient. A gradient that is darker at the edges reads as a rim
    once the launcher masks it: the eye sees a border enclosing a smaller disc
    instead of one icon filling its circle.
  -->
  <rect width="512" height="512" fill="#FBEDE4"/>
</svg>
