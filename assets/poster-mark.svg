    The template's placeholder mark: a card with a few lines of text and a
    "like" dot. Replace it with your own artwork, keep the file name, and rerun
    scripts/build-icons.sh and scripts/build-brand-assets.sh.

    The CSS classes are read by the landing page (see SiteChrome / LandingPage):
    .wash is dimmed in dark mode, .ink follows the page's ink colour.
  -->
