    <rect x="230" y="230" width="360" height="34" rx="17" fill="#D4D2F8"/>
    <rect x="230" y="310" width="440" height="24" rx="12" fill="#E1E1E9"/>
    <rect x="230" y="366" width="400" height="24" rx="12" fill="#E1E1E9"/>
    <rect x="230" y="422" width="300" height="24" rx="12" fill="#E1E1E9"/>
    <circle cx="640" cy="560" r="46" fill="#FCEBCE" stroke="#F49D0A" stroke-width="14"/>
    <circle cx="640" cy="560" r="12" fill="#F49D0A"/>
