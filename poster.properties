# poster.properties — the one file to edit to make this template yours.
#
# Read by Gradle at configuration time. Everything here becomes generated
# Kotlin constants in the shared module (com.example.poster.config.*), so the
# Android app, the iOS app and the server all see the same values:
#
#   Features.GROUPS, Features.TAGS, ...   (const val — off means the
#                                                compiler and R8 drop the code)
#   BrandPalette.Light.primary, .Dark.primary   (ARGB Long, all Material roles)
#   AppInfo.NAME, AppInfo.SCHEME, AppInfo.WEB_ORIGIN
#
# The Android manifest (deep-link scheme/host) and the window colours are fed
# from the same file. iOS reads the framework, so it follows automatically;
# only the URL scheme in iosApp/Configuration/Config.xcconfig has to match by
# hand (POSTER_URL_SCHEME).
#
# Renaming the package, application id or display name is a different job:
# scripts/rename-app.sh does that across the whole tree.

# ---------------------------------------------------------------------------
# App identity
# ---------------------------------------------------------------------------
# Shown on the web pages and in emails. The in-app name lives in strings.xml
# (app_name) and the store listings; keep them in step.
app.name=Poster
# Custom URL scheme for deep links (poster://join/CODE, poster://post/TOKEN).
app.scheme=poster
# Where the server is reachable from the public internet. Invite and share
# links are built on it, and the Android App Links filter claims this host.
app.webOrigin=https://poster.example.com

# ---------------------------------------------------------------------------
# Features. true/false. Missing = true.
# ---------------------------------------------------------------------------
# Invite-only groups: posts can be shared with a group, members and
# invitations are managed in the app, /groups routes on the server.
feature.groups=true
# Tags on posts, the tag picker, tag filtering, /tags routes.
feature.tags=true
# The Like button, the "Liked" tab, like counts, the who-liked roster.
feature.likes=true
# Public share links (https://.../p/TOKEN) and the read-only web page for them.
feature.sharing=true
# "Mark as resolved" on your own post, with an optional outcome message.
feature.postCompletion=true
# The Everyone / Group / Only me picker. Off = every post is public.
feature.postVisibility=true
# A local daily notification at a chosen time (Settings).
feature.dailyReminder=true
# The Feedback screen (send a message to the developer, read replies).
feature.feedback=true
# In-app purchases through RevenueCat ("Support the developer"). Off also
# removes the RevenueCat SDK from the Android build.
feature.support=true
# "Report this post" and the reports queue in the admin panel.
feature.reports=true
# POST /crashes from the apps and the crash list in the admin panel.
feature.crashReports=true
# Anonymous diagnostic events (slow login, feed failed) to /events.
feature.telemetry=true
# Writing a post or creating a group needs a confirmed email address.
feature.emailVerificationRequired=true
# Per-post language and the reading-languages profile setting (en/ru).
feature.multiLanguage=true
# Sign-in providers. Each also needs its ids configured (see docs/SignIn.md);
# a provider is only shown when the flag is on AND an id is present.
feature.googleSignIn=true
feature.appleSignIn=true
# One picture per post: the photo picker in the form, the image on cards and
# on the share page, POST/GET /uploads on the server (files in POSTER_UPLOADS_DIR).
# Off = the field is dropped everywhere and no upload directory is created.
feature.images=true
# Comments under posts: a thread on the details screen, a count on cards,
# /posts/{id}/comments on the server, a Comments page in the admin panel.
feature.comments=true
# Push notifications (FCM on Android, APNs on iOS) and the in-app activity
# list: likes and comments on your posts, being added to a group, someone
# joining a group you own. The senders need keys — docs/PushNotifications.md;
# without them the server keeps the in-app list and logs what it would push.
feature.pushNotifications=true
# Passwordless sign-in: "Email me a sign-in link" on the login screen. The link
# signs in (and creates the account for a new address) and confirms the email.
# Needs the mailer (docs/Email.md); with none configured the link is printed.
feature.magicLink=true
# Names and avatars on posts and comments. Off = posts are anonymous (the
# Share-Pray default): a name appears only where the person opted in (the
# liked-by roster). On = every post and comment shows who wrote it, and the
# profile has a picture (needs feature.images for the upload).
feature.authors=true
# Groups anybody can find and join from a list, next to invite-only ones.
# Off = every group is invite-only (the original behaviour).
feature.publicGroups=true
# ---------------------------------------------------------------------------
# Look. Material 3 is the baseline; these opt into the "liquid" treatment
# (docs/LiquidDesign.md): translucent glass surfaces over a blurred backdrop,
# softer and larger radii, a floating capsule tab bar.
# ---------------------------------------------------------------------------
# Glass cards, sheets and headers, rounder shapes. Works on both platforms;
# Android below 12 gets the tint without the blur.
feature.liquidDesign=false
# The floating capsule tab bar over the content instead of the docked bar.
# Independent of liquidDesign so either can be tried alone.
feature.liquidNavBar=false

