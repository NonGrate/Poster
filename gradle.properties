#Kotlin
kotlin.code.style=official
# Release Kotlin/Native compilation (the iOS Archive framework build) is whole-
# program and heap-hungry; 2G OOMs it. 4G builds it and still fits a 16G machine
# alongside Xcode.
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Ktor
io.ktor.development=true
# The Google Web OAuth client id. Public: it ships in the app and only says
# which project tokens must be minted for. The server checks the same value
# (POSTER_GOOGLE_CLIENT_ID), so the two must agree.
posterGoogleClientId=

# The Apple "Sign in with Apple" Services ID — the OAuth client id for the
# Android browser flow. Public (it ships in the app); the server checks the same
# value (POSTER_APPLE_SERVICE_ID). Blank hides the Apple button on Android.
posterAppleServiceId=
# Firebase Cloud Messaging for feature.pushNotifications on Android: the public
# values from Firebase console → Project settings → Your apps (Android). All
# four or none. iOS uses APNs directly and needs nothing here.
posterFirebaseProjectId=
posterFirebaseAppId=
posterFirebaseApiKey=
posterFirebaseSenderId=

# AGP 9 refuses to sit alongside the Kotlin Multiplatform plugin without these.
# Its recommended fix is to move the modules onto
# com.android.kotlin.multiplatform.library, which is a restructuring of the
# build rather than a version bump; these are the escape hatch AGP documents
# for exactly that gap. Remove them once the modules move to that plugin.
android.builtInKotlin=false
android.newDsl=false
